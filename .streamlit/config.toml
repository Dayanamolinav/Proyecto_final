[theme]
primaryColor = "#2048ff"
backgroundColor = "#f2f0eb"
secondaryBackgroundColor = "#e8e5de"
textColor = "#0d0f14"
font = "sans serif"
paddingTop = "0rem"
paddingBottom = "0rem"

[server]
# Sirve app/static/ en /app/static/ (videos y fotos de la portada)
enableStaticServing = true

[client]
toolbarMode = "minimal"
